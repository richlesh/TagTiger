[workspace]
resolver = "2"
members = ["core", "cli", "gui", "launch"]

[workspace.package]
version = "1.1.0"
edition = "2021"
rust-version = "1.75"
license = "GPL-3.0-or-later"
authors = ["TagTiger contributors"]
repository = "https://github.com/yourname/tagtiger"
description = "Cross-platform MP4/M4V metadata tagger with TMDB lookup"

[workspace.dependencies]
# Shared
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", default-features = false, features = ["std", "serde", "clock"] }

# Async + HTTP
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "time"] }
# Use rustls WITHOUT the default aws-lc-rs provider (whose aws-lc-sys C build
# complicates static-CRT linking on Windows, esp. aarch64). We install the
# pure-Rust `ring` provider at startup instead — see rustls dep below.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider", "stream", "query"] }
# Pull in rustls' `ring` crypto provider; installed process-wide at startup.
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
futures = "0.3"

# MP4 iTunes-style tagging (pure Rust, compiled into the binary — not an external tool)
mp4ameta = "0.13"

# Images / artwork
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

# Platform paths
dirs = "7"

# License-key HMAC validation
hmac = "0.12"
sha2 = "0.10"

# Internal
tagtiger-core = { path = "core" }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
