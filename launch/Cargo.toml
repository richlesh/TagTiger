[package]
name = "tagtiger-launch"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "macOS launcher shim: captures Open-With files and execs the TagTiger GUI"

[[bin]]
name = "tagtiger-launch"
path = "src/main.rs"

# macOS-only Cocoa launcher. On other platforms it builds as a trivial no-op so
# the workspace still compiles everywhere.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5.2"
objc2-foundation = { version = "0.2.2", features = [
    "NSString", "NSArray", "NSURL", "NSThread",
] }
objc2-app-kit = { version = "0.2.2", features = [
    "NSApplication", "NSResponder", "NSRunningApplication",
] }
