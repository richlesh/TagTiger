# Configuration for `cross` (used for the aarch64 Linux release build).
# Forward the license salt into the build container so gui/build.rs can
# generate the git-ignored gui/src/license.rs at compile time.
[build.env]
passthrough = ["LICENSE_SALT"]

# The Slint GUI (femtovg/winit backend) links system libraries — fontconfig,
# X11, xkbcommon, GL — which the default `cross` container does not carry for
# the *target* architecture. Install their arm64 dev packages inside the
# container before building. `$CROSS_DEB_ARCH` expands to the target's Debian
# arch (arm64) per the cross docs.
[target.aarch64-unknown-linux-gnu]
pre-build = [
    "dpkg --add-architecture $CROSS_DEB_ARCH",
    "apt-get update && apt-get install --assume-yes --no-install-recommends libfontconfig-dev:$CROSS_DEB_ARCH libx11-dev:$CROSS_DEB_ARCH libxcursor-dev:$CROSS_DEB_ARCH libxrandr-dev:$CROSS_DEB_ARCH libxi-dev:$CROSS_DEB_ARCH libgl1-mesa-dev:$CROSS_DEB_ARCH libxkbcommon-dev:$CROSS_DEB_ARCH",
]
